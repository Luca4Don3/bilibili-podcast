[project]
name = "bilibili-podcast"
version = "1.0.0"
description = "Convert Bilibili user uploads and playlists into podcast RSS feeds"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = { file = "LICENSE" }
dependencies = [
  "bilibili-api-python @ git+https://github.com/Nemo2011/bilibili-api.git@87110fe2db7af77425057e163f064700087a3c35",
  "feedgen==1.0.0",
  "PyYAML>=6.0",
  "requests>=2.27.1",
  "curl_cffi>=0.15.0,<0.16",
  "aiohttp>=3.14.1,<4",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1.0",
  "yt-dlp>=2026.6.9,<2027",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]

authors = [{ name = "bilibili-podcast Maintainers" }]

[project.optional-dependencies]
browser = [
  "playwright>=1.60,<2",
]
dev = [
  "pip-audit>=2.10.1",
  "pytest>=9.1.1",
]

[project.scripts]
bilibili-podcast = "bilibili_podcast.sync:main"
bilibili-podcast-admin = "bilibili_podcast.cli_admin:main"
bilibili-podcast-config = "bilibili_podcast.config.cli:main"
bilibili-podcast-web = "bilibili_podcast.web.runner:main"
bilibili-podcast-publish = "bilibili_podcast.publisher:main"
bilibili-podcast-crontab = "bilibili_podcast.crontab:main"

[project.urls]
homepage = "https://github.com/example/bilibili-podcast"

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
bilibili_podcast = ["web/templates/*.html", "config/migration/schemas/*.sql"]
