name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements.lock -e ".[browser,dev]"
      - name: Run tests and dependency checks
        run: |
          python -m pytest tests/
          python -m pip check
          python -m pip_audit

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate tag and source policy
        run: |
          python -c 'import os, re; tag = os.environ["GITHUB_REF_NAME"]; assert re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag), tag'
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "${GITHUB_REF_NAME#v}"
          python scripts/check_name_policy.py commits --base "${GITHUB_SHA}^" --head "${GITHUB_SHA}"
          python scripts/check_name_policy.py refs
      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip
          python -m pip install build cyclonedx-bom
          python -m build
          git archive --format=tar.gz --output="dist/bilibili-podcast-source-${GITHUB_REF_NAME}.tar.gz" HEAD
          mkdir wheelhouse
          python -m pip wheel -c requirements.lock --wheel-dir wheelhouse ".[browser]"
          (cd wheelhouse && sha256sum -- * > ../wheelhouse.SHA256SUMS)
          tar -czf "dist/bilibili-podcast-wheelhouse-${GITHUB_REF_NAME}.tar.gz" wheelhouse
          cp wheelhouse.SHA256SUMS dist/wheelhouse.SHA256SUMS
          python -m pip install -c requirements.lock ".[browser]"
          cyclonedx-py environment --output-format JSON --output-file dist/bilibili-podcast.cdx.json
          cd dist
          sha256sum -- * > SHA256SUMS
      - name: Scan release asset names and contents
        run: python scripts/check_name_policy.py assets dist/*
      - name: Verify release artifact contents
        run: |
          python - <<'PY'
          import pathlib
          import tarfile
          import zipfile

          forbidden = {".git", ".temp", ".venv", "build", "__pycache__"}
          forbidden_suffixes = {".db", ".log", ".m4a", ".mp3", ".mp4", ".sqlite", ".sqlite3", ".webm"}
          archives = list(pathlib.Path("dist").glob("*.tar.gz")) + list(pathlib.Path("dist").glob("*.whl"))
          for path in archives:
              names = (
                  [item.name for item in tarfile.open(path).getmembers()]
                  if path.name.endswith(".tar.gz")
                  else zipfile.ZipFile(path).namelist()
              )
              parts = [part for name in names for part in pathlib.PurePosixPath(name).parts]
              assert forbidden.isdisjoint(parts), (path, forbidden.intersection(parts))
              assert not any(pathlib.PurePosixPath(name).suffix in forbidden_suffixes for name in names), path
              if "wheelhouse" not in path.name:
                  assert any(pathlib.PurePosixPath(name).name == "LICENSE" for name in names), path
          PY
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --generate-notes
