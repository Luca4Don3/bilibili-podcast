[downloads]
max_per_run = 20
scheduled_max_per_run = 1
min_free_gb = 5.0

[paths]
cookie_file = "__ROOT__/runtime/secrets/cookies.txt"
lock_file = "__ROOT__/runtime/state/bilibili-podcast.lock"

[browser]
user_data_root = "__ROOT__/runtime/browser"
playwright_browsers_path = "__ROOT__/runtime/playwright"
login_wait_seconds = 5.0

[timeouts]
sync_seconds = 300
preview_seconds = 120
publish_seconds = 60

[logging]
level = "INFO"
retention_days = 30
max_bytes = 20971520
backup_count = 10
